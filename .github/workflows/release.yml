name: Manual Release (WinUI 3 + Inno Setup)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 0.1.0)'
        required: true
        type: string
        default: '0.1.0'
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Optional release summary notes'
        required: false
        type: string
        default: 'Initial TierShift Phase 1 (MVP) release with Inno Setup installer and portable x64 archive.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Package Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semantic version input
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid version '${{ inputs.version }}'. Expected semver such as 0.1.0 or 0.1.0-beta.1."
            exit 1
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet dependencies
        run: dotnet restore TierShift.sln -r win-x64

      - name: Run TierShift.Core xUnit test suite
        run: dotnet test tests/TierShift.Core.Tests/TierShift.Core.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish Unpackaged WinUI 3 App (self-contained win-x64)
        shell: pwsh
        run: |
          $ver = ("${{ inputs.version }}" -split '-')[0]
          dotnet publish src/TierShift.App/TierShift.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=${{ inputs.version }} `
            -p:AssemblyVersion=$ver.0 `
            -p:FileVersion=$ver.0 `
            -o artifacts/publish/win-x64

      - name: Build recommended Inno Setup installer (TierShift-Setup-x64.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc `
            "/DMyAppVersion=${{ inputs.version }}" `
            "/DPublishDir=..\artifacts\publish\win-x64" `
            "/DOutputDir=..\artifacts\release" `
            installer/TierShift.iss

      - name: Create portable x64 ZIP archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/publish/win-x64/*" `
            -DestinationPath "artifacts/release/TierShift-${{ inputs.version }}-win-x64-portable.zip" `
            -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path artifacts/release -File
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TierShift v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ${{ inputs.release_notes }}

            ### Recommended Installer
            - **Windows Installer (`TierShift-Setup-${{ inputs.version }}-x64.exe`)**: Inno Setup installer tailored for Unpackaged WinUI 3 with `requireAdministrator` elevation and native Windows Settings > Uninstall integration.
            - **Portable Archive (`TierShift-${{ inputs.version }}-win-x64-portable.zip`)**: Self-contained x64 binary package.
            - **Checksums (`SHA256SUMS.txt`)**: SHA-256 verification hashes for all artifacts.
          files: |
            artifacts/release/TierShift-Setup-${{ inputs.version }}-x64.exe
            artifacts/release/TierShift-${{ inputs.version }}-win-x64-portable.zip
            artifacts/release/SHA256SUMS.txt
