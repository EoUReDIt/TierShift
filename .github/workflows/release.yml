name: Manual Release (WinUI 3 + Inno Setup)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 0.1.0)'
        required: true
        type: string
        default: '0.1.0'
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        type: boolean
        default: false
      allow_overwrite:
        description: 'Allow updating an existing tag/release with the same version'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Optional release summary notes'
        required: false
        type: string
        default: 'Initial TierShift Phase 1 (MVP) release with Inno Setup installer and portable x64 archive.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Package Windows x64 Installer
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
      RELEASE_NOTES: ${{ inputs.release_notes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semantic version & check tag collision
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid version '$env:VERSION'. Expected semver such as 0.1.0 or 0.1.0-beta.1."
            exit 1
          }

          if ($env:ALLOW_OVERWRITE -ne 'true') {
            $existing = git ls-remote --tags origin "refs/tags/v$env:VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not [string]::IsNullOrWhiteSpace($existing)) {
              Write-Error "Tag 'v$env:VERSION' already exists. Bump version or enable 'allow_overwrite'."
              exit 1
            }
          }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify pinned .NET 8 SDK
        shell: pwsh
        run: |
          $sdk = (dotnet --version).Trim()
          Write-Host "Active .NET SDK: $sdk"
          if ($sdk -notmatch '^8\.0\.') {
            Write-Error "Expected .NET 8.0.x SDK via global.json, but found '$sdk'."
            exit 1
          }

      - name: Restore NuGet dependencies
        run: dotnet restore TierShift.sln -r win-x64

      - name: Run TierShift.Core xUnit test suite
        run: dotnet test tests/TierShift.Core.Tests/TierShift.Core.Tests.csproj -c Release -p:Platform=x64 -r win-x64 --verbosity normal

      - name: Publish Unpackaged WinUI 3 App (self-contained win-x64)
        shell: pwsh
        run: |
          $ver = ($env:VERSION -split '-')[0]
          dotnet publish src/TierShift.App/TierShift.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=$env:VERSION `
            -p:AssemblyVersion="$ver.0" `
            -p:FileVersion="$ver.0" `
            -o artifacts/publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exePath = "artifacts/publish/win-x64/TierShift.App.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Publish completed but expected executable was not found at '$exePath'."
            exit 1
          }

      - name: Build recommended Inno Setup installer (TierShift-Setup-x64.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null

          function Find-Iscc {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
            )
            foreach ($path in $candidates) {
              if (Test-Path $path) { return $path }
            }
            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Write-Error "ISCC.exe not found after installing Inno Setup."
            exit 1
          }

          $publishDir = (Resolve-Path "artifacts/publish/win-x64").Path
          $outputDir = (Resolve-Path "artifacts/release").Path

          & $iscc `
            "/DMyAppVersion=$env:VERSION" `
            "/DPublishDir=$publishDir" `
            "/DOutputDir=$outputDir" `
            installer/TierShift.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable x64 ZIP archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/publish/win-x64/*" `
            -DestinationPath "artifacts/release/TierShift-$env:VERSION-win-x64-portable.zip" `
            -Force

      - name: Generate SHA-256 checksums & release notes body
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path artifacts/release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM

          $body = @(
            $env:RELEASE_NOTES
            ''
            '### Recommended Installer'
            ('- **Windows Installer (`TierShift-Setup-' + $env:VERSION + '-x64.exe`)**: Inno Setup installer tailored for Unpackaged WinUI 3 with `requireAdministrator` elevation and native Windows Settings > Uninstall integration.')
            ('- **Portable Archive (`TierShift-' + $env:VERSION + '-win-x64-portable.zip`)**: Self-contained x64 binary package.')
            '- **Checksums (`SHA256SUMS.txt`)**: SHA-256 verification hashes for all artifacts.'
          ) -join "`n"
          $body | Out-File -FilePath artifacts/RELEASE_NOTES.md -Encoding utf8NoBOM

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TierShift-v${{ inputs.version }}-win-x64
          path: |
            artifacts/release/TierShift-Setup-${{ inputs.version }}-x64.exe
            artifacts/release/TierShift-${{ inputs.version }}-win-x64-portable.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Sync existing Git tag when allow_overwrite is enabled
        if: ${{ inputs.allow_overwrite }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [string]::IsNullOrWhiteSpace($existing)) {
            git tag -f $tag HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "refs/tags/$tag" --force
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TierShift v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body_path: artifacts/RELEASE_NOTES.md
          files: |
            artifacts/release/TierShift-Setup-${{ inputs.version }}-x64.exe
            artifacts/release/TierShift-${{ inputs.version }}-win-x64-portable.zip
            artifacts/release/SHA256SUMS.txt
